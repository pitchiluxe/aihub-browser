<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Black void background -->
  <rect width="400" height="300" fill="#1a1a2e"/>

  <!-- Emerging light rays -->
  <defs>
    <radialGradient id="lightGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#fff9e6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffe4b5;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Central light source -->
  <circle cx="200" cy="100" r="80" fill="url(#lightGradient)"/>

  <!-- Light rays -->
  <line x1="200" y1="20" x2="200" y2="0" stroke="#fff9e6" stroke-width="3" opacity="0.8"/>
  <line x1="270" y1="40" x2="290" y2="20" stroke="#ffe4b5" stroke-width="2" opacity="0.6"/>
  <line x1="130" y1="40" x2="110" y2="20" stroke="#ffe4b5" stroke-width="2" opacity="0.6"/>

  <!-- Text -->
  <text x="200" y="250" text-anchor="middle" font-family="serif" font-size="20" font-weight="bold" fill="#fff9e6">
    In the beginning
  </text>
  <text x="200" y="280" text-anchor="middle" font-family="serif" font-size="16" fill="#ffe4b5">
    God created light
  </text>
</svg>
