<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="300" fill="url(#skyGradient)"/>

  <!-- Sun -->
  <circle cx="320" cy="60" r="40" fill="#FFD700"/>
  <circle cx="320" cy="60" r="45" fill="#FFA500" opacity="0.3"/>

  <!-- Clouds -->
  <ellipse cx="80" cy="50" rx="40" ry="20" fill="white" opacity="0.8"/>
  <ellipse cx="60" cy="55" rx="25" ry="15" fill="white" opacity="0.8"/>
  <ellipse cx="100" cy="55" rx="30" ry="15" fill="white" opacity="0.8"/>

  <!-- Ground -->
  <rect y="200" width="400" height="100" fill="#8B7355"/>

  <!-- Grass -->
  <ellipse cx="100" cy="200" rx="20" ry="8" fill="#228B22" opacity="0.7"/>
  <ellipse cx="200" cy="200" rx="25" ry="10" fill="#32CD32" opacity="0.7"/>
  <ellipse cx="300" cy="200" rx="20" ry="8" fill="#228B22" opacity="0.7"/>

  <!-- Text -->
  <text x="200" y="280" text-anchor="middle" font-family="serif" font-size="20" font-weight="bold" fill="white">
    Let there be light!
  </text>
</svg>
