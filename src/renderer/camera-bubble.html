<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The Screen Pen's live camera bubble: what the presenter sees of
         themselves while a recording runs, inside AIHub's border. It is a
         small child window of the app (see recorder:cameraBubble in main),
         because a tab's page paints over anything in the app's own HTML. The
         title reports the camera's state back to main: 'live' or 'none'. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; media-src 'self' blob: mediastream:;" />
    <title>Camera</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
      /* Just the circle: no ring, no shadow. A shadow cannot be round here —
         the window is square, so it was cut off into visible straight edges. */
      .bubble {
        position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
        clip-path: circle(50% at 50% 50%);
        background: transparent;
      }
      video {
        width: 100%; height: 100%; object-fit: cover; display: block;
        /* Mirrored, the way people expect to see themselves — and the way a
           whole-screen recording will show it, since it records this bubble. */
        transform: scaleX(-1);
        opacity: 0; transition: opacity 240ms ease;
      }
      video.live { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="bubble"><video id="cam" autoplay muted playsinline></video></div>
    <script type="module">
      const video = document.getElementById('cam')
      let stream = null
      const start = async () => {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false,
          })
          // Marked live on the first frame actually playing, not on play()
          // resolving: a window still coming onto the screen can hold that
          // promise open indefinitely.
          video.addEventListener('playing', () => {
            video.classList.add('live')
            document.title = 'live'
          }, { once: true })
          video.srcObject = stream
          video.play().catch(() => {})
          // A camera that goes away mid-recording: say so, and show nothing.
          stream.getVideoTracks()[0]?.addEventListener('ended', () => {
            video.classList.remove('live')
            document.title = 'none'
          })
        } catch {
          // No camera: an empty ring would look like a broken camera, so main
          // is told and the recorder closes the bubble.
          document.title = 'none'
        }
      }
      window.addEventListener('beforeunload', () => stream?.getTracks().forEach(t => t.stop()))
      void start()
    </script>
  </body>
</html>
